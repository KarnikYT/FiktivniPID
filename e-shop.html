<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Shop | Fiktivní PID (Prague Community)</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #2563eb;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .shop-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      height: fit-content;
    }

    .header {
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--text-main);
    }

    .header p {
      margin: 5px 0 0;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .auth-section {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .auth-status {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-auth {
      width: auto;
      font-size: 0.8rem;
      padding: 6px 12px;
    }

    .btn-pay {
      background: var(--accent-green);
      font-size: 1.05rem;
      margin-top: 15px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-sub);
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      color: white;
      font-size: 0.95rem;
    }

    .price-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent-green);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-top: 20px;
    }

    .price-amount {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent-green);
    }

    /* Modal Okno Tadx Pay */
    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .tadx-pay-card {
      background: #0f172a;
      border: 2px solid var(--accent-gold);
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }

    .tadx-logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .pin-display {
      font-size: 2rem;
      letter-spacing: 8px;
      color: var(--accent-green);
      margin: 15px 0;
      min-height: 40px;
    }

    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .pin-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: white;
      padding: 12px;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .pin-btn:active { background: var(--border-color); }

    .result-box {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-green);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="shop-container">
    <div class="header">
      <h1>E-Shop Fiktivní PID</h1>
      <p>Prague Community – Kupónový Portál</p>
    </div>

    <!-- Firebase Auth sekce -->
    <div class="auth-section">
      <div class="auth-status" id="auth-user">Status: Nepřihlášen</div>
      <button class="btn btn-auth" id="btn-login">Přihlásit Google</button>
    </div>

    <!-- Formulář objednávky -->
    <div id="shop-form">
      <label for="discord-nick">Discord uživatelské jméno</label>
      <input type="text" id="discord-nick" placeholder="např. uzivatel_123">

      <label for="roblox-nick">Roblox uživatelské jméno</label>
      <input type="text" id="roblox-nick" placeholder="např. RobloxPlayerCZ">

      <label for="pass-duration">Doba platnosti předplatného</label>
      <select id="pass-duration" onchange="recalculatePrice()">
        <option value="220" data-days="7">Týdenní kupón (7 dní)</option>
        <option value="550" data-days="30">Měsíční kupón (30 dní)</option>
        <option value="2800" data-days="180">6 měsíců kupón (180 dní)</option>
        <option value="3650" data-days="365">Roční kupón (365 dní)</option>
        <option value="9900" data-days="1095">3 roky kupón (1095 dní)</option>
      </select>

      <label for="pass-category">Věková kategorie cestujícího</label>
      <select id="pass-category" onchange="recalculatePrice()">
        <option value="0" data-discount="100">Dítě 0-6 let (Zdarma - 100% sleva)</option>
        <option value="0.5" data-discount="50">Dítě / žák 6-15 let (Sleva 50%)</option>
        <option value="0.5" data-discount="50">Student 15-26 let (Sleva 50%)</option>
        <option value="1" data-discount="0">Dospělý 15+ (Plné jízdné)</option>
        <option value="0.5" data-discount="50">Senior 65+ (Sleva 50%)</option>
      </select>

      <label for="pay-method">Způsob platby</label>
      <select id="pay-method">
        <option value="Tadx Pay">💳 Tadx Pay (Virtuální karta)</option>
        <option value="Bankovní převod">🏦 Bankovní převod</option>
      </select>

      <div class="price-box">
        <div style="font-size: 0.85rem; color: var(--text-sub);">Výsledná cena kuponu:</div>
        <div class="price-amount" id="final-price-display">0 Kč</div>
      </div>

      <button class="btn btn-pay" onclick="initiateTadxPay()">Zaplatit přes Tadx Pay</button>
    </div>

    <!-- Výsledek po úspěšné platbě -->
    <div class="result-box" id="result-box">
      <h3 style="color: var(--accent-green); margin:0 0 10px 0;">✔ PŘEDPLATNÉ AKTIVNÍ</h3>
      <div id="qrcode" style="display: flex; justify-content: center; background: white; padding: 10px; border-radius: 8px; margin: 10px 0;"></div>
      <p style="font-family: monospace; font-weight: bold; margin: 5px 0;" id="ticket-id-text"></p>
      <p style="font-size:0.8rem; color: var(--text-sub);">Potvrzení bylo úspěšně odesláno na Discord!</p>
    </div>
  </div>

  <!-- Tadx Pay Brána (Modal) -->
  <div class="modal-overlay" id="tadx-modal">
    <div class="tadx-pay-card">
      <div class="tadx-logo">💳 TADX PAY GATEWAY</div>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin: 5px 0;">Fiktivní PID (Prague Community)</p>
      
      <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin: 10px 0;">
        <span style="font-size: 0.8rem; color: var(--text-sub);">Částka k úhradě:</span>
        <div style="font-size: 1.3rem; font-weight: bold; color: var(--accent-gold);" id="tadx-amount">0 Kč</div>
      </div>

      <p style="font-size: 0.8rem; margin-top: 10px;">Zadejte 4místný PIN karty Tadx Pay:</p>
      <div class="pin-display" id="pin-display">••••</div>

      <div class="pin-pad">
        <button class="pin-btn" onclick="pressPin('1')">1</button>
        <button class="pin-btn" onclick="pressPin('2')">2</button>
        <button class="pin-btn" onclick="pressPin('3')">3</button>
        <button class="pin-btn" onclick="pressPin('4')">4</button>
        <button class="pin-btn" onclick="pressPin('5')">5</button>
        <button class="pin-btn" onclick="pressPin('6')">6</button>
        <button class="pin-btn" onclick="pressPin('7')">7</button>
        <button class="pin-btn" onclick="pressPin('8')">8</button>
        <button class="pin-btn" onclick="pressPin('9')">9</button>
        <button class="pin-btn" style="background: #ef4444;" onclick="clearPin()">✕</button>
        <button class="pin-btn" onclick="pressPin('0')">0</button>
        <button class="pin-btn" style="background: var(--accent-green);" onclick="confirmPayment()">✓</button>
      </div>
      <button onclick="closeTadxModal()" style="background: transparent; border: none; color: var(--text-sub); margin-top: 15px; cursor: pointer; font-size: 0.8rem;">Zrušit platbu</button>
    </div>
  </div>

  <!-- FIREBASE AUTH MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCA8xhs3qS9NH7XoedqDjdL2WY7gh0_-WE",
      authDomain: "fiktivnipid.firebaseapp.com",
      projectId: "fiktivnipid",
      storageBucket: "fiktivnipid.firebasestorage.app",
      messagingSenderId: "858723196116",
      appId: "1:858723196116:web:05dbbe2f8684277e30af41"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.currentUser = null;

    const loginBtn = document.getElementById('btn-login');
    const authStatus = document.getElementById('auth-user');

    loginBtn.addEventListener('click', () => {
      if (window.currentUser) {
        signOut(auth);
      } else {
        signInWithPopup(auth, provider);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUser = user;
        authStatus.textContent = "Přihlášen: " + user.email;
        loginBtn.textContent = "Odhlásit";
      } else {
        window.currentUser = null;
        authStatus.textContent = "Status: Nepřihlášen";
        loginBtn.textContent = "Přihlásit Google";
      }
    });
  </script>

  <!-- HLAVNÍ LOGIKA E-SHOPU A TADX PAY -->
  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1557415618313982022/ybSNIbxCfbWFrNLLE_7HkaNqgqYCk-YejNcS-ks2bPt0tfsiuyjDT91qVXOVjPPLZTnJ";

    let enteredPin = "";
    let calculatedPrice = 0;

    function recalculatePrice() {
      const basePrice = parseFloat(document.getElementById('pass-duration').value);
      const ratio = parseFloat(document.getElementById('pass-category').value);
      calculatedPrice = Math.round(basePrice * ratio);
      
      document.getElementById('final-price-display').textContent = `${calculatedPrice} Kč`;       document.getElementById('tadx-amount').textContent = `${calculatedPrice} Kč`;
    }

    function initiateTadxPay() {
      if (!window.currentUser) {
        alert("🔒 Pro nákup se musíte nejprve přihlásit přes Google!");
        return;
      }

      const discord = document.getElementById('discord-nick').value.trim();
      const roblox = document.getElementById('roblox-nick').value.trim();

      if (!discord || !roblox) {
        alert("Vyplňte prosím své Discord a Roblox uživatelské jméno!");
        return;
      }

      enteredPin = "";
      updatePinDisplay();
      document.getElementById('tadx-modal').style.display = "flex";
    }

    function pressPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDisplay();
      }
    }

    function clearPin() {
      enteredPin = "";
      updatePinDisplay();
    }

    function updatePinDisplay() {
      document.getElementById('pin-display').textContent = '•'.repeat(enteredPin.length) || '••••';
    }

    function closeTadxModal() {
      document.getElementById('tadx-modal').style.display = "none";
    }

    async function confirmPayment() {
      if (enteredPin.length !== 4) {
        alert("Zadejte kompletní 4místný PIN kód!");
        return;
      }

      closeTadxModal();
      await processOrder();
    }

    async function processOrder() {
      const discord = document.getElementById('discord-nick').value.trim();
      const roblox = document.getElementById('roblox-nick').value.trim();
      
      const durationSelect = document.getElementById('pass-duration');
      const durationText = durationSelect.options[durationSelect.selectedIndex].text;

      const categorySelect = document.getElementById('pass-category');
      const categoryText = categorySelect.options[categorySelect.selectedIndex].text;

      const payMethod = document.getElementById('pay-method').value;

      const ticketId = "PID-" + Math.floor(100000 + Math.random() * 900000);

      // Generování QR kódu
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, { text: ticketId, width: 120, height: 120 });
      
      document.getElementById('ticket-id-text').textContent = ticketId;
      document.getElementById('result-box').style.display = "block";

      // Odeslání Discord Embedu
      const payload = {
        username: "Fiktivní PID - E-Shop Bot",
        avatar_url: "https://i.imgur.com/4M34gB0.png",
        embeds: [{
          title: "👑 Zakoupeno Dlouhodobé Předplatné PID",
          color: 1610753, // Zelená barva
          description: "Vytvořena nová objednávka v E-Shopu Prague Community.",
          fields: [
            { name: "👤 Google Účet", value: window.currentUser.email, inline: false },
            { name: "💬 Discord Uživatel", value: discord, inline: true },
            { name: "🎮 Roblox Uživatel", value: roblox, inline: true },
            { name: "🎟️ Typ Předplatného", value: durationText, inline: false },
            { name: "👥 Věková Kategorie", value: categoryText, inline: false },
            { name: "💳 Platba & Částka", value: `${payMethod} (${calculatedPrice} Kč)`, inline: true },
            { name: "🆔 ID Jízdenky", value: `\`${ticketId}\``, inline: true }
          ],
          footer: { text: "Fiktivní PID • Prague Community E-Shop" },
          timestamp: new Date().toISOString()
        }]
      };

      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        alert("✔ Platba přes Tadx Pay proběhla úspěšně a jízdenka je aktivní!");
      } catch (err) {
        console.error("Chyba při odesílání webhooku:", err);
        alert("✔ Jízdenka aktivována!");
      }
    }

    // Inicializace výchozí ceny
    recalculatePrice();
  </script>
</body>
</html>
